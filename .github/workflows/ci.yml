name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Build docker image
        run: docker build -t micro-api .

  publish-image:
    runs-on: ubuntu-latest
    needs: [docker-build, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/heraclesnyx/micro-api:latest
  smoke-test:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6
      - name: Créer le fichier .env
        run: cp .env.example .env
      - name: Lancer docker compose
        run: docker compose up -d --build --wait
      - name: Tester notre api sur /health
        run: curl -f http://localhost:8000/health
      - name: Créer une tâche via POST
        run: |
          curl -f -X POST http://localhost:8000/tasks -H "Content-Type: application/json" -d '{ "title": "test"}'
      - name: Tester notre api sur /tasks
        run: |
          response=$(curl -fsS http://localhost:8000/tasks)
          echo "$response"
          echo "$response" | jq -e '.[0].title == "test"'
      - name: Afficher les logs
        if: failure()
        run: docker compose logs
      - name: Nettoyage du conteneur
        if: always()
        run: docker compose down -v
